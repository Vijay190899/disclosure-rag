name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Test
        run: uv run pytest

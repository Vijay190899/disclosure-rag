[project]
name = "disclosure-rag"
dynamic = ["version"]
description = "Grounded question answering over EU financial filings, with citations benchmarked against Inline XBRL ground truth."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Vijay Ananth Karunanithi" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",          # required by fastapi.testclient
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
# The spike is isolated so its heavy, throwaway dependencies never reach the
# runtime image. See spikes/esef_probe/README.md.
spike = [
    "lxml>=5.3",        # ix: element parsing. Arelle is the M1 choice, see the spike README.
    "playwright>=1.48", # headless Chromium for element geometry and print-to-PDF
    "pymupdf>=1.24",    # reads the rendered PDF back to verify the geometry
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/disclosure_rag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/disclosure_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Spikes are throwaway code answering a yes/no question. They are linted for
# real errors but not held to the annotation standard of the package.
"spikes/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Spikes are excluded deliberately: they are not part of the shipped package.
exclude = ["^spikes/"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

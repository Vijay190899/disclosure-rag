[project]
name = "disclosure-rag"
dynamic = ["version"]
description = "Grounded question answering over EU financial filings, with citations benchmarked against Inline XBRL ground truth."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Vijay Ananth Karunanithi" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "lxml>=5.3",            # Inline XBRL parsing in the label plane
    "pymupdf>=1.24",        # PDF block parsing and page rendering in ingest
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",          # required by fastapi.testclient
    "ruff>=0.7",
    "mypy>=1.13",
    "lxml-stubs>=0.5",
    "pre-commit>=4.0",
]
# Rendering tools for building the label corpus. Kept out of the runtime image:
# the service never renders anything, and these are large. Imported lazily in
# disclosure_rag.labels.locate so the package stays importable without them.
labels = [
    "playwright>=1.48",     # headless Chromium, print-to-PDF for the label plane only
    "httpx>=0.27",          # fetching report packages
]
# Dense retrieval. fastembed runs ONNX rather than torch, which keeps the install
# small enough that the evaluation stays reproducible on an ordinary machine.
dense = [
    "fastembed>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/disclosure_rag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/disclosure_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Optional label-plane tools, imported lazily and absent from the base install.
module = ["qdrant_client.*", "fitz.*", "playwright.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
